name: my-vercel-project

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm prisma:generate && pnpm dev"
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: my_vercel_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_vercel_project"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_node_modules:
  app_next:
  postgres_data:

